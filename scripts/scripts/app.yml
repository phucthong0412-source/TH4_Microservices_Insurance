name: th1

services:
  dotnet-agent-portal-gateway:
    build: 
      context: ../../
      dockerfile: AgentPortalApiGateway/AgentPortalApiGateway/Dockerfile
    image: dotnet-agent-portal-gateway
    container_name: dotnet-agent-portal-gateway
    ports:
    - 8099:8099

  dotnet-auth-service:
    build: 
      context: ../../
      dockerfile: scripts/scripts/Dockerfile.service
      args:
        SERVICE: AuthService
        RUNTIME_VERSION: '9.0'
    image: dotnet-auth-service
    container_name: dotnet-auth-service
    ports:
    - 6060:6060
    environment:
      ASPNETCORE_URLS: http://+:6060
      ASPNETCORE_ENVIRONMENT: docker
  
  dotnet-chat-service:
    build: 
      context: ../../
      dockerfile: scripts/scripts/Dockerfile.service
      args:
        SERVICE: ChatService
        RUNTIME_VERSION: '9.0'
    image: dotnet-chat-service
    container_name: dotnet-chat-service
    ports:
    - 4099:4099
    environment:
      ASPNETCORE_URLS: http://+:4099
      ASPNETCORE_ENVIRONMENT: docker

  dotnet-payment-service:
